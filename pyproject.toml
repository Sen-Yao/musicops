[project]
name = "musicops"
version = "0.1.0"
description = "Yggdrasil internal music operations control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "mutagen>=1.47",
  "opencc-python-reimplemented>=0.1.7",
  "telethon>=1.35",
  "python-socks>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicops = ["prompts/*.md", "templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
