services:
  musicops:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MUSICOPS_BUILD_COMMIT: ${MUSICOPS_BUILD_COMMIT:-unknown}
        MUSICOPS_BUILD_TIME: ${MUSICOPS_BUILD_TIME:-unknown}
    image: musicops:latest
    container_name: musicops
    restart: unless-stopped
    user: musicops
    ports:
      - "${MUSICOPS_HOST_PORT:-8088}:8088"
    environment:
      - MUSICOPS_API_TOKEN=${MUSICOPS_API_TOKEN}
      - MUSICOPS_DATA_DIR=/data
      - MUSICOPS_LIBRARY_ROOT=/music
      - MUSICOPS_TELEGRAM_SESSION_NAME=${MUSICOPS_TELEGRAM_SESSION_NAME:-senyao_userbot}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - MUSICOPS_METADATA_PROVIDER=${MUSICOPS_METADATA_PROVIDER:-musicbrainz}
      - MUSICOPS_METADATA_PROVIDERS=${MUSICOPS_METADATA_PROVIDERS:-musicbrainz,netease,qq,apple_music,spotify}
      - MUSICOPS_MUSICBRAINZ_API_URL=${MUSICOPS_MUSICBRAINZ_API_URL:-https://musicbrainz.org/ws/2}
      - MUSICOPS_COVER_ART_API_URL=${MUSICOPS_COVER_ART_API_URL:-https://coverartarchive.org}
      - MUSICOPS_METADATA_USER_AGENT=${MUSICOPS_METADATA_USER_AGENT:-musicops/0.1-personal-library-manager}
      - MUSICOPS_NETEASE_API_URL=${MUSICOPS_NETEASE_API_URL:-https://music.163.com/api}
      - MUSICOPS_QQ_API_URL=${MUSICOPS_QQ_API_URL:-https://u.y.qq.com/cgi-bin/musicu.fcg}
      - MUSICOPS_QQ_ALBUM_API_URL=${MUSICOPS_QQ_ALBUM_API_URL:-https://c.y.qq.com/v8/fcg-bin/fcg_v8_album_info_cp.fcg}
      - MUSICOPS_APPLE_MUSIC_API_URL=${MUSICOPS_APPLE_MUSIC_API_URL:-https://api.music.apple.com/v1}
      - MUSICOPS_APPLE_MUSIC_DEVELOPER_TOKEN=${MUSICOPS_APPLE_MUSIC_DEVELOPER_TOKEN:-}
      - MUSICOPS_APPLE_MUSIC_STOREFRONTS=${MUSICOPS_APPLE_MUSIC_STOREFRONTS:-cn,tw,hk,us}
      - MUSICOPS_SPOTIFY_API_URL=${MUSICOPS_SPOTIFY_API_URL:-https://api.spotify.com/v1}
      - MUSICOPS_SPOTIFY_ACCOUNTS_API_URL=${MUSICOPS_SPOTIFY_ACCOUNTS_API_URL:-https://accounts.spotify.com/api}
      - MUSICOPS_SPOTIFY_CLIENT_ID=${MUSICOPS_SPOTIFY_CLIENT_ID:-}
      - MUSICOPS_SPOTIFY_CLIENT_SECRET=${MUSICOPS_SPOTIFY_CLIENT_SECRET:-}
      - MUSICOPS_SPOTIFY_MARKETS=${MUSICOPS_SPOTIFY_MARKETS:-CN,TW,HK,US}
      - MUSIC_STT_ENDPOINT=${MUSIC_STT_ENDPOINT:-http://192.168.1.6:8000/v1/audio/transcriptions}
      - MUSIC_STT_MODEL=${MUSIC_STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      - MUSIC_STT_TIMEOUT=${MUSIC_STT_TIMEOUT:-120}
    volumes:
      - musicops-data:/data
      - ${TELEGRAM_SESSION_PATH:-/tmp}:/sessions:ro
      - ${MUSICOPS_LIBRARY_PATH:-/mnt/user/media/music}:/music:rw
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  musicops-data:
