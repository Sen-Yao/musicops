<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        :root {
            --bg-deep: #09090b;
            --bg-card: rgba(28, 28, 31, 0.88);
            --bg-elevated: rgba(58, 58, 62, 0.72);
            --text-primary: #f5f5f7;
            --text-secondary: rgba(245, 245, 247, 0.58);
            --text-muted: rgba(245, 245, 247, 0.34);
            --accent-gold: #f1c76f;
            --accent-warm: #ff9f5a;
            --border-subtle: rgba(255,255,255,0.08);
            --shadow-soft: 0 18px 48px rgba(0,0,0,0.36);
            --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-apple);
            background: linear-gradient(180deg, #111114 0%, var(--bg-deep) 42%, #050506 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ===== Ambient Background ===== */
        .ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255,255,255,0.022) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent 76%);
        }

        .ambient::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent 34%, rgba(241,199,111,0.035));
        }

        /* ===== Noise Texture Overlay ===== */
        .noise {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* ===== Main Container ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 100px;
        }

        /* ===== Header Section ===== */
        .header {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 48px;
            margin-bottom: 60px;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Album Cover ===== */
        .cover-wrapper {
            position: relative;
        }

        .cover {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: var(--shadow-soft), 0 0 0 1px var(--border-subtle);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .cover:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-soft), 0 0 60px rgba(201, 165, 92, 0.15);
        }

        .cover-glow {
            display: none;
        }

        /* ===== Song Info ===== */
        .info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-title {
            font-size: 52px;
            font-weight: 750;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: 0;
        }

        .info-artist {
            font-size: 26px;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 24px;
        }

        .info-meta {
            display: flex;
            gap: 32px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .meta-value {
            color: var(--text-secondary);
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 8px;
            animation: fadeUp 0.8s ease-out 0.1s backwards;
        }

        .tab {
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-apple);
            font-size: 0.95rem;
            font-weight: 650;
            color: var(--text-secondary);
            border: none;
            background: transparent;
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--bg-elevated);
        }

        .tab.active {
            background: var(--bg-elevated);
            color: var(--accent-gold);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* ===== Lyrics Container ===== */
        .lyrics-container {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 48px;
            box-shadow: var(--shadow-soft);
            border: 1px var(--border-subtle) solid;
            backdrop-filter: blur(18px);
            animation: fadeUp 0.8s ease-out 0.2s backwards;
        }

        .lyrics-panel {
            display: none;
        }

        .lyrics-panel.active {
            display: block;
        }

        /* ===== Bilingual Lyrics Stack ===== */
        .lyrics-stack {
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            margin: 0;
            text-align: left;
        }

        .lyric-pair {
            padding: 4px 0 10px;
        }

        .lyric-original,
        .lyric-translation {
            font-family: var(--font-apple);
            letter-spacing: 0;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .lyric-original {
            color: var(--text-primary);
            font-size: 44px;
            line-height: 1.12;
            font-weight: 760;
        }

        .lyric-translation {
            color: var(--text-secondary);
            font-size: 26px;
            line-height: 1.25;
            font-weight: 620;
            margin-top: 9px;
        }

        .lyric-pair-unmatched {
            opacity: 0.82;
        }

        .raw-lyrics {
            background: var(--bg-deep);
            padding: 24px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        .lyrics-line {
            margin-bottom: 20px;
            font-size: 1.05rem;
            color: var(--text-primary);
            opacity: 0.9;
            transition: opacity 0.3s ease, color 0.3s ease;
        }

        .lyrics-line:hover {
            opacity: 1;
            color: var(--accent-warm);
        }

        .lyrics-line.original {
            font-style: normal;
        }

        .lyrics-line.translated {
            font-style: italic;
            color: var(--text-secondary);
        }

        .lyrics-line.translated:hover {
            color: var(--accent-gold);
        }

        /* ===== Action Buttons ===== */
        .actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, var(--bg-deep) 0%, transparent 100%);
            padding: 40px 20px 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 100;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 8px;
            font-family: var(--font-apple);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-warm) 100%);
            color: var(--bg-deep);
            box-shadow: 0 4px 20px rgba(201, 165, 92, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 165, 92, 0.4);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px var(--border-subtle) solid;
        }

        .btn-secondary:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .btn-danger {
            background: transparent;
            color: #e74c3c;
            border: 1px rgba(231, 76, 60, 0.3) solid;
        }

        .btn-danger:hover {
            background: rgba(231, 76, 60, 0.1);
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .header {
                grid-template-columns: 200px 1fr;
                gap: 32px;
            }
        }

        @media (max-width: 600px) {
            .header {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .cover-wrapper {
                max-width: 280px;
                margin: 0 auto;
            }

            .info-meta {
                justify-content: center;
                flex-wrap: wrap;
                gap: 16px;
            }

            .tabs {
                justify-content: center;
            }

            .lyrics-container {
                padding: 32px 20px;
            }

            .lyrics-stack {
                gap: 26px;
            }

            .actions {
                flex-wrap: wrap;
            }
        }

        /* ===== Print Styles ===== */
        @media print {
            .ambient, .noise, .tabs, .actions {
                display: none;
            }

            body {
                background: white;
                color: black;
            }

            .lyrics-container {
                background: white;
                box-shadow: none;
                border: 1px #ccc solid;
            }
        }

        /* ===== MusicOps Approval Extensions ===== */
        button, select {
            font: inherit;
            letter-spacing: 0;
        }

        button:focus-visible,
        select:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--accent-gold);
            outline-offset: 3px;
        }

        .review-topline {
            width: min(1500px, calc(100% - 40px));
            margin: 0 auto;
            padding: 24px 0 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 650;
            text-transform: uppercase;
        }

        .review-layout {
            width: min(1500px, calc(100% - 40px));
            margin: 0 auto;
        }

        .review-layout.with-batch {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 32px;
            align-items: start;
        }

        .review-layout .container {
            width: 100%;
            min-width: 0;
            padding-left: 0;
            padding-right: 0;
        }

        .batch-region {
            position: sticky;
            top: 20px;
            padding-top: 40px;
        }

        .batch-region:empty {
            display: none;
        }

        .batch-nav {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
        }

        .batch-nav-heading {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 12px;
        }

        .batch-nav-heading strong {
            color: var(--accent-gold);
        }

        .song-nav-button {
            width: 100%;
            display: grid;
            gap: 3px;
            padding: 13px 16px;
            border: 0;
            border-bottom: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
        }

        .song-nav-button:last-child {
            border-bottom: 0;
        }

        .song-nav-button:hover,
        .song-nav-button.active {
            background: var(--bg-elevated);
        }

        .song-nav-button.active {
            box-shadow: inset 3px 0 0 var(--accent-gold);
        }

        .song-nav-button small {
            color: var(--text-muted);
        }

        .batch-select-label,
        #batch-song-select {
            display: none;
        }

        .song-panel[hidden],
        .lyrics-panel[hidden],
        .review-view-panel[hidden] {
            display: none;
        }

        .review-mode-tabs {
            display: flex;
            gap: 4px;
            margin: -20px 0 28px;
            padding: 6px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: rgba(9, 9, 11, 0.7);
        }

        .review-mode-tab {
            min-height: 44px;
            padding: 10px 20px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font: 650 14px/1.2 var(--font-apple);
            cursor: pointer;
        }

        .review-mode-tab:hover,
        .review-mode-tab.active {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .review-mode-tab.active {
            color: var(--accent-gold);
        }

        .review-view-panel.active {
            display: block;
        }

        .song-kicker {
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .info-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px 28px;
            margin: 0;
        }

        .info-meta div {
            min-width: 0;
        }

        .info-meta dt {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 2px;
        }

        .info-meta dd {
            margin: 0;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
        }

        .cover-wrapper {
            min-width: 0;
        }

        .cover-placeholder {
            display: grid;
            place-items: center;
            background:
                linear-gradient(135deg, rgba(241, 199, 111, 0.12), transparent 55%),
                var(--bg-card);
            color: var(--accent-gold);
            font-size: 64px;
        }

        .cover-state {
            display: block;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .cover-state.verified {
            color: var(--accent-gold);
        }

        .format-warning {
            display: grid;
            grid-template-columns: 1fr minmax(240px, 420px);
            gap: 24px;
            align-items: start;
            margin: -20px 0 28px;
            padding: 16px 18px;
            border: 1px solid rgba(241, 199, 111, 0.34);
            border-radius: 8px;
            background: rgba(241, 199, 111, 0.07);
        }

        .format-warning strong {
            color: var(--accent-gold);
        }

        .format-warning p {
            margin-top: 4px;
            color: var(--text-secondary);
        }

        .format-warning summary,
        .audit-proof summary,
        .item-json summary {
            cursor: pointer;
            color: var(--accent-gold);
            font-weight: 650;
        }

        .untimed-list {
            display: grid;
            gap: 6px;
            margin-top: 12px;
        }

        .untimed-row {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 10px;
        }

        .untimed-number {
            color: var(--text-muted);
            font: 12px/1.6 "SF Mono", Menlo, monospace;
        }

        .untimed-row code {
            color: var(--text-secondary);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .tabs {
            position: sticky;
            top: 0;
            z-index: 20;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(18px);
        }

        .tab {
            min-height: 44px;
            font-weight: 650;
        }

        .lyrics-stack {
            max-width: 900px;
        }

        .lyric-pair {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr);
            gap: 18px;
            padding: 8px 0 18px;
        }

        .timestamp {
            color: var(--text-muted);
            font: 12px/1.6 "SF Mono", Menlo, monospace;
        }

        .lyric-copy p,
        .diff-columns p {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .lyric-primary {
            color: var(--text-primary);
            font-size: 36px;
            line-height: 1.16;
            font-weight: 760;
        }

        .lyric-companion {
            margin-top: 8px !important;
            color: var(--text-secondary);
            font-size: 24px;
            line-height: 1.28;
            font-weight: 620;
        }

        .empty-state {
            padding: 28px;
            border: 1px dashed var(--border-subtle);
            color: var(--text-secondary);
            text-align: center;
        }

        .diff-view {
            display: grid;
            gap: 18px;
        }

        .diff-toolbar {
            display: inline-flex;
            width: fit-content;
            padding: 4px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--bg-deep);
        }

        .mode-button {
            min-height: 36px;
            padding: 7px 14px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .mode-button.active {
            background: var(--bg-elevated);
            color: var(--accent-gold);
        }

        .diff-view[data-mode="changes"] .diff-row[data-change="unchanged"] {
            display: none;
        }

        .diff-list {
            display: grid;
            gap: 14px;
        }

        .diff-row {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(9, 9, 11, 0.44);
        }

        .diff-time {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            padding: 9px 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .change-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
        }

        .diff-row[data-change="added"] .change-label {
            color: #86d4ac;
        }

        .diff-row[data-change="removed"] .change-label {
            color: #f29a9a;
        }

        .diff-row[data-change="changed"] .change-label {
            color: var(--accent-gold);
        }

        .diff-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .diff-columns section {
            min-width: 0;
            padding: 14px 16px 18px;
        }

        .diff-columns section + section {
            border-left: 1px solid var(--border-subtle);
        }

        .diff-columns h4,
        .raw-grid h3 {
            margin: 0 0 10px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .diff-columns .lyric-primary {
            font-size: 18px;
            line-height: 1.45;
        }

        .diff-columns .lyric-companion {
            font-size: 15px;
        }

        .diff-empty {
            color: var(--text-muted);
        }

        .raw-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .raw-grid section {
            min-width: 0;
        }

        .raw-grid.single {
            grid-template-columns: minmax(0, 1fr);
        }

        .raw-lyrics {
            max-height: 620px;
            margin: 0;
        }

        .item-json {
            margin-top: 18px;
        }

        .import-review {
            padding: 40px 48px 52px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--bg-card);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(18px);
        }

        .import-heading {
            margin-bottom: 26px;
        }

        .import-heading h2 {
            margin: 0;
            font-size: 28px;
        }

        .import-warning {
            margin-bottom: 12px;
            padding: 13px 15px;
            border: 1px solid rgba(242, 154, 154, 0.38);
            border-radius: 6px;
            background: rgba(127, 29, 29, 0.18);
            color: #f5b5b5;
        }

        .evidence-sections {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 34px;
        }

        .evidence-section {
            min-width: 0;
            padding: 22px 0 26px;
            border-top: 1px solid var(--border-subtle);
        }

        .evidence-section h3 {
            margin: 0 0 13px;
            color: var(--accent-gold);
            font-size: 15px;
        }

        .evidence-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .evidence-table th,
        .evidence-table td {
            padding: 7px 0;
            border: 0;
            border-bottom: 1px solid rgba(255,255,255,0.045);
            text-align: left;
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        .evidence-table th {
            width: 38%;
            padding-right: 14px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
        }

        .evidence-table td {
            color: var(--text-secondary);
            font: 13px/1.55 "SF Mono", Menlo, monospace;
        }

        .audit-proof {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto 64px;
            padding: 16px 18px;
            border-top: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .audit-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 24px;
            margin-top: 18px;
        }

        .audit-grid div {
            min-width: 0;
        }

        .audit-grid span {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .audit-grid code {
            display: block;
            overflow-wrap: anywhere;
            color: var(--text-secondary);
        }

        .approval-json {
            margin-top: 18px;
        }

        @media (max-width: 980px) {
            .review-layout.with-batch {
                display: block;
            }

            .batch-region {
                position: static;
                padding: 22px 0 0;
            }

            .batch-nav {
                display: none;
            }

            .batch-select-label {
                display: block;
                margin-bottom: 6px;
                color: var(--text-muted);
                font-size: 12px;
            }

            #batch-song-select {
                display: block;
                width: 100%;
                min-height: 44px;
                padding: 8px 12px;
                border: 1px solid var(--border-subtle);
                border-radius: 8px;
                background: var(--bg-card);
                color: var(--text-primary);
            }
        }

        @media (max-width: 720px) {
            .review-topline,
            .review-layout,
            .audit-proof {
                width: min(100% - 28px, 1200px);
            }

            .info-title {
                font-size: 34px;
            }

            .info-artist {
                font-size: 21px;
            }

            .info-meta,
            .raw-grid,
            .audit-grid,
            .format-warning,
            .evidence-sections {
                grid-template-columns: 1fr;
            }

            .review-mode-tabs {
                overflow-x: auto;
            }

            .review-mode-tab {
                flex: 0 0 auto;
            }

            .tabs {
                overflow-x: auto;
                justify-content: start;
            }

            .tab {
                flex: 0 0 auto;
                padding: 10px 16px;
            }

            .lyrics-container {
                padding: 28px 18px;
            }

            .import-review {
                padding: 28px 18px 36px;
            }

            .lyric-pair {
                grid-template-columns: 48px minmax(0, 1fr);
                gap: 10px;
            }

            .lyric-primary {
                font-size: 27px;
            }

            .lyric-companion {
                font-size: 19px;
            }

            .diff-columns {
                grid-template-columns: 1fr;
            }

            .diff-columns section + section {
                border-top: 1px solid var(--border-subtle);
                border-left: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="lyrics-review">
    <div class="ambient"></div>
    <div class="noise"></div>
    <p class="review-topline">{{batch_label}}</p>
    <div class="review-layout {{layout_class}}">
        <div class="batch-region">{{batch_navigation}}</div>
        <main class="container">{{song_panels}}</main>
    </div>
    {{audit_proof}}
    <script>
        document.querySelectorAll('[data-review-view-target]').forEach(tab => {
            tab.addEventListener('click', () => {
                const panel = tab.closest('.song-panel');
                panel.querySelectorAll('[data-review-view-target]').forEach(candidate => {
                    candidate.classList.remove('active');
                    candidate.setAttribute('aria-selected', 'false');
                });
                panel.querySelectorAll('[data-review-view-panel]').forEach(view => {
                    view.classList.remove('active');
                    view.hidden = true;
                });
                tab.classList.add('active');
                tab.setAttribute('aria-selected', 'true');
                const view = document.getElementById(tab.dataset.reviewViewTarget);
                view.hidden = false;
                view.classList.add('active');
            });
        });

        document.querySelectorAll('.tab[data-tab-target]').forEach(tab => {
            tab.addEventListener('click', () => {
                const panel = tab.closest('.song-panel');
                panel.querySelectorAll('.tab[data-tab-target]').forEach(t => {
                    t.classList.remove('active');
                    t.setAttribute('aria-selected', 'false');
                });
                panel.querySelectorAll('[data-tab-panel]').forEach(view => {
                    view.classList.remove('active');
                    view.hidden = true;
                });
                tab.classList.add('active');
                tab.setAttribute('aria-selected', 'true');
                const view = document.getElementById(tab.dataset.tabTarget);
                view.hidden = false;
                view.classList.add('active');
            });
        });

        function showSong(targetId) {
            document.querySelectorAll('[data-song-panel]').forEach(panel => {
                const active = panel.dataset.songPanel === targetId;
                panel.hidden = !active;
                panel.classList.toggle('active', active);
            });
            document.querySelectorAll('[data-song-target]').forEach(button => {
                button.classList.toggle('active', button.dataset.songTarget === targetId);
            });
            const select = document.getElementById('batch-song-select');
            if (select) select.value = targetId;
        }

        document.querySelectorAll('[data-song-target]').forEach(button => {
            button.addEventListener('click', () => showSong(button.dataset.songTarget));
        });

        const songSelect = document.getElementById('batch-song-select');
        if (songSelect) songSelect.addEventListener('change', () => showSong(songSelect.value));

        document.querySelectorAll('[data-diff-mode]').forEach(button => {
            button.addEventListener('click', () => {
                const view = document.getElementById(button.dataset.diffTarget);
                view.dataset.mode = button.dataset.diffMode;
                view.querySelectorAll('[data-diff-mode]').forEach(candidate => {
                    candidate.classList.toggle('active', candidate === button);
                });
            });
        });
    </script>
</body>
</html>
