services:
  musicops:
    image: ${MUSICOPS_IMAGE:?MUSICOPS_IMAGE is required}
    container_name: musicops
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8086:8088"
    env_file:
      - ./.env.runtime
    environment:
      MUSICOPS_API_TOKEN: ""
      MUSICOPS_DATA_DIR: /data
      MUSICOPS_LIBRARY_ROOT: /music
      MUSICOPS_API_TOKEN_FILE: /run/secrets/musicops_api_token
      MUSICOPS_IMAGE_ID: ${MUSICOPS_IMAGE_ID:?MUSICOPS_IMAGE_ID is required}
      MUSICOPS_PUBLIC_BASE_URL: ${MUSICOPS_PUBLIC_BASE_URL:?MUSICOPS_PUBLIC_BASE_URL is required}
    volumes:
      - /mnt/user/appdata/musicops/data:/data:rw
      - /mnt/user/appdata/music-manager/scripts:/sessions:ro
      - /mnt/user/media/music:/music:rw
    secrets:
      - musicops_api_token
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

secrets:
  musicops_api_token:
    file: ${MUSICOPS_API_TOKEN_FILE:?MUSICOPS_API_TOKEN_FILE is required}
