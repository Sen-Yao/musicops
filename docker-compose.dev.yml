services:
  musicops-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        MUSICOPS_BUILD_COMMIT: ${MUSICOPS_BUILD_COMMIT:-dev}
        MUSICOPS_BUILD_TIME: ${MUSICOPS_BUILD_TIME:-dev}
    image: musicops-dev:latest
    container_name: musicops-dev
    restart: unless-stopped
    user: musicops
    ports:
      - "${MUSICOPS_DEV_BIND:-127.0.0.1}:${MUSICOPS_DEV_HOST_PORT:-18086}:8088"
    environment:
      - MUSICOPS_API_TOKEN=${MUSICOPS_API_TOKEN:-dev-token}
      - MUSICOPS_DATA_DIR=/data
      - MUSICOPS_LIBRARY_ROOT=/music
      - PYTHONPATH=/app/src
      - MUSICOPS_TELEGRAM_SESSION_NAME=${MUSICOPS_TELEGRAM_SESSION_NAME:-senyao_userbot}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - MUSIC_STT_ENDPOINT=${MUSIC_STT_ENDPOINT:-http://192.168.1.6:8000/v1/audio/transcriptions}
      - MUSIC_STT_MODEL=${MUSIC_STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      - MUSIC_STT_TIMEOUT=${MUSIC_STT_TIMEOUT:-120}
    volumes:
      - ${MUSICOPS_DEV_SOURCE:-/mnt/user/appdata/musicops-dev/source}/src:/app/src:ro
      - ${MUSICOPS_DEV_DATA:-/mnt/user/appdata/musicops-dev/data}:/data
      - ${MUSICOPS_LIBRARY_PATH:-/mnt/user/media/music}:/music:ro
      - ${TELEGRAM_SESSION_PATH:-/tmp}:/sessions:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=5).read()",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s
